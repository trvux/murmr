# On every push and pull request: build everything on a clean GitHub-hosted Mac and run the checks.
# This is the answer to "does it build and start anywhere other than my laptop?"
# The app is built to run on macOS 14 or later, but GitHub retired its macOS 14 runners on 2026-11-02, so macos-15 is the
# oldest system it can be started on here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15 # Apple Silicon; the oldest hosted macOS that still exists
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Engine checks
        run: |
          go vet .
          go test .

      - name: Cache the self-built whisper-server
        uses: actions/cache@v4
        with:
          path: app/vendor
          key: whisper-${{ hashFiles('app/scripts/build-whisper.sh') }}

      - name: Build the app (needs cmake the first time, for whisper-server)
        run: |
          brew install cmake || true
          app/scripts/bundle.sh # ad-hoc signed: there is no certificate on the runner

      - name: whisper-server starts on a clean Mac
        run: '"app/build/Murmr Stream.app/Contents/Resources/whisper-server" --help 2>&1 | head -5'

      - name: App checks
        run: |
          app/scripts/design-lint.sh
          "app/build/Murmr Stream.app/Contents/MacOS/MurmrStream" --dict-selftest
